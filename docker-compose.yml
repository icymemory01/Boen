# 博文 Boen 本地 / 单机部署
#
#   cp .env.example .env      # 填 DEEPSEEK_API_KEY 与 FROST_ID_* 等
#   docker compose up -d --build
#   前端 http://localhost:8080    健康检查 http://localhost:8787/api/health
#
# 说明：
# - 两个服务共用同一个 Dockerfile 的不同 target，前端产物在镜像内构建，
#   不依赖宿主机先跑 npm run build
# - 数据落在 ./data（SQLite + 错题图片），删容器不丢数据
# - 生产环境请在前面再加一层 HTTPS（Caddy / 云 LB / 现有 nginx 承接）

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: boen-server:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8787"
      NODE_ENV: production
      LOG_LEVEL: info
    volumes:
      - ./data:/app/apps/server/data
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: boen-web:local
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
